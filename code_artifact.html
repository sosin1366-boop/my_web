<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 노트 앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Pen+Script&family=Gaegu&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
        }
        /* Canvas workspace wrapper with drop-shadow */
        .paper-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        /* Custom scrollbar for toolbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Paper pattern backgrounds */
        .bg-grid {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-lines {
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 28px;
        }
        /* Floating text input container */
        .floating-text-node {
            position: absolute;
            cursor: move;
        }
        .floating-text-node textarea {
            resize: both;
            outline: none;
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- TOP BAR Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-pen-to-square text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-800 leading-tight">스마트 노트 스튜디오</h1>
                <p class="text-xs text-slate-500">드로잉, 텍스트, 이미지 지원 노트</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Paper Size Selector -->
            <div class="flex items-center gap-1 text-sm bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                <label for="paperSize" class="text-xs font-semibold text-slate-500">용지 규격:</label>
                <select id="paperSize" class="bg-transparent font-medium text-slate-700 outline-none cursor-pointer">
                    <option value="A4">A4 (794 x 1123)</option>
                    <option value="A5">A5 (595 x 842)</option>
                    <option value="B5">B5 (676 x 960)</option>
                    <option value="Square">정사각형 (800 x 800)</option>
                    <option value="Wide">와이드 16:9 (1280 x 720)</option>
                </select>
            </div>

            <!-- Paper Background Selector -->
            <div class="flex items-center gap-1 text-sm bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                <label for="paperStyle" class="text-xs font-semibold text-slate-500">배경:</label>
                <select id="paperStyle" class="bg-transparent font-medium text-slate-700 outline-none cursor-pointer">
                    <option value="blank">무지</option>
                    <option value="grid">모눈종이</option>
                    <option value="lines">줄노트</option>
                </select>
            </div>

            <!-- Undo / Redo Buttons -->
            <div class="flex items-center gap-1 border-l border-r border-slate-200 px-2 my-0.5">
                <button id="undoBtn" class="px-2 py-1.5 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-1 text-xs font-medium disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-600" title="뒤로 가기 (Ctrl+Z)">
                    <i class="fa-solid fa-rotate-left"></i> 뒤로
                </button>
                <button id="redoBtn" class="px-2 py-1.5 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-1 text-xs font-medium disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-slate-600" title="앞으로 가기 (Ctrl+Y)">
                    <i class="fa-solid fa-rotate-right"></i> 앞으로
                </button>
            </div>

            <!-- Action Buttons -->
            <button id="clearBtn" class="px-3 py-1.5 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors flex items-center gap-1">
                <i class="fa-solid fa-trash-can"></i> 전체 지우기
            </button>
            <button id="saveBtn" class="px-3.5 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors flex items-center gap-1">
                <i class="fa-solid fa-download"></i> 이미지 저장
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- LEFT TOOLBAR (Tools, Pens, Images, Text) -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col p-4 gap-4 overflow-y-auto shrink-0 z-10 shadow-sm">
            
            <!-- Mode Selection (Draw / Text / Image) -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">기본 모드</h3>
                <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
                    <button id="modeDraw" class="mode-btn py-2 rounded-lg text-xs font-semibold flex flex-col items-center gap-1 bg-white text-indigo-600 shadow-sm transition-all">
                        <i class="fa-solid fa-pen-nib text-sm"></i> 펜 그리기
                    </button>
                    <button id="modeText" class="mode-btn py-2 rounded-lg text-xs font-semibold flex flex-col items-center gap-1 text-slate-600 hover:bg-white/50 transition-all">
                        <i class="fa-solid fa-font text-sm"></i> 텍스트
                    </button>
                    <button id="modeEraser" class="mode-btn py-2 rounded-lg text-xs font-semibold flex flex-col items-center gap-1 text-slate-600 hover:bg-white/50 transition-all">
                        <i class="fa-solid fa-eraser text-sm"></i> 지우개
                    </button>
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- 10 PENS SELECTION -->
            <div id="penOptionsSection">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">펜 종류 (10종)</h3>
                    <span id="currentPenName" class="text-xs font-semibold text-indigo-600">볼펜</span>
                </div>
                <div class="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto pr-1 no-scrollbar">
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border rounded-lg border-indigo-600 bg-indigo-50 text-indigo-900 font-medium transition-all" data-pen="ballpoint">
                        <span class="w-3 h-3 rounded-full bg-slate-900"></span> 볼펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="fountain">
                        <span class="w-3 h-3 rounded-full bg-blue-900"></span> 만년필
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="highlighter">
                        <span class="w-3 h-3 rounded-full bg-yellow-400 opacity-60"></span> 형광펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="brush">
                        <span class="w-3 h-3 rounded-full bg-amber-800"></span> 붓펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="pencil">
                        <span class="w-3 h-3 rounded-full bg-slate-400"></span> 연필
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="calligraphy">
                        <span class="w-3 h-3 rounded-full bg-emerald-700"></span> 캘리펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="neon">
                        <span class="w-3 h-3 rounded-full bg-cyan-400"></span> 네온펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="spray">
                        <span class="w-3 h-3 rounded-full bg-purple-500"></span> 스프레이
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="dashed">
                        <span class="w-3 h-3 rounded-full bg-rose-500"></span> 점선펜
                    </button>
                    <button class="pen-select-btn flex items-center gap-2 p-2 text-xs border border-slate-200 hover:border-slate-300 rounded-lg text-slate-700 transition-all" data-pen="crayon">
                        <span class="w-3 h-3 rounded-full bg-orange-500"></span> 크레용
                    </button>
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- COLOR & SIZE CONTROL -->
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1.5">색상 지정</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="penColor" value="#1e293b" class="w-9 h-9 rounded-lg border border-slate-200 cursor-pointer bg-white p-0.5">
                        <div class="flex gap-1 flex-1">
                            <button class="quick-color w-6 h-6 rounded-full bg-slate-900 border border-slate-300" data-color="#0F172A"></button>
                            <button class="quick-color w-6 h-6 rounded-full bg-red-500 border border-slate-300" data-color="#EF4444"></button>
                            <button class="quick-color w-6 h-6 rounded-full bg-blue-500 border border-slate-300" data-color="#3B82F6"></button>
                            <button class="quick-color w-6 h-6 rounded-full bg-emerald-500 border border-slate-300" data-color="#10B981"></button>
                            <button class="quick-color w-6 h-6 rounded-full bg-amber-400 border border-slate-300" data-color="#F59E0B"></button>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span>두께 / 크기</span>
                        <span id="sizeVal">3 px</span>
                    </div>
                    <input type="range" id="penSize" min="1" max="50" value="3" class="w-full accent-indigo-600 cursor-pointer">
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- IMAGE INSERTION -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">미디어 첨부</h3>
                <label class="w-full flex items-center justify-center gap-2 p-2.5 bg-slate-50 border border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/30 rounded-xl cursor-pointer transition-all text-xs text-slate-600 font-medium">
                    <i class="fa-solid fa-image text-indigo-500 text-sm"></i> 사진 이미지 추가
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                </label>
            </div>

            <div class="mt-auto text-xs text-slate-400 text-center">
                Canvas Note v1.0
            </div>
        </aside>

        <!-- CANVAS SCROLL AREA -->
        <main class="flex-1 overflow-auto p-8 bg-slate-200 flex justify-center items-start" id="canvasContainer">
            <!-- CANVAS BOARD WRAPPER -->
            <div id="paperWrapper" class="relative bg-white paper-shadow transition-all duration-300 ease-out">
                <!-- Main Canvas for Drawing -->
                <canvas id="noteCanvas" class="block cursor-crosshair rounded-sm"></canvas>
                
                <!-- Overlay Layer for Draggable Elements (Text Boxes / Images) -->
                <div id="overlayLayer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            </div>
        </main>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Canvas & Context Setup
        const canvas = document.getElementById('noteCanvas');
        const ctx = canvas.getContext('2d');
        const paperWrapper = document.getElementById('paperWrapper');
        const overlayLayer = document.getElementById('overlayLayer');

        // Inputs & Controls
        const paperSizeSelect = document.getElementById('paperSize');
        const paperStyleSelect = document.getElementById('paperStyle');
        const penColorInput = document.getElementById('penColor');
        const penSizeInput = document.getElementById('penSize');
        const sizeValDisplay = document.getElementById('sizeVal');
        const imageInput = document.getElementById('imageInput');
        const currentPenNameDisplay = document.getElementById('currentPenName');
        
        // Buttons
        const modeDrawBtn = document.getElementById('modeDraw');
        const modeTextBtn = document.getElementById('modeText');
        const modeEraserBtn = document.getElementById('modeEraser');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');

        // App States
        let currentMode = 'draw'; // 'draw', 'text', 'eraser'
        let currentPen = 'ballpoint';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Undo & Redo History Management
        const historyStack = [];
        const redoStack = [];
        const MAX_HISTORY = 30;

        function updateUndoRedoState() {
            undoBtn.disabled = historyStack.length === 0;
            redoBtn.disabled = redoStack.length === 0;
        }

        function saveHistory() {
            if (historyStack.length >= MAX_HISTORY) {
                historyStack.shift();
            }
            historyStack.push(canvas.toDataURL());
            redoStack.length = 0; // Clear redo history when a new action is performed
            updateUndoRedoState();
        }

        function undo() {
            if (historyStack.length === 0) return;
            redoStack.push(canvas.toDataURL());
            const previousState = historyStack.pop();
            restoreCanvasState(previousState);
            updateUndoRedoState();
        }

        function redo() {
            if (redoStack.length === 0) return;
            historyStack.push(canvas.toDataURL());
            const nextState = redoStack.pop();
            restoreCanvasState(nextState);
            updateUndoRedoState();
        }

        function restoreCanvasState(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Keyboard Shortcuts (Ctrl+Z / Ctrl+Y / Cmd+Z / Cmd+Shift+Z)
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        // Paper Dimensions Mapping (Width x Height in px)
        const paperDimensions = {
            'A4': { w: 794, h: 1123 },
            'A5': { w: 595, h: 842 },
            'B5': { w: 676, h: 960 },
            'Square': { w: 800, h: 800 },
            'Wide': { w: 1280, h: 720 }
        };

        // Initialize Canvas Size & Scale
        function initPaperSize() {
            const sizeKey = paperSizeSelect.value;
            const dim = paperDimensions[sizeKey] || paperDimensions['A4'];
            
            // Save existing canvas image data before resizing
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            // Resize DOM elements
            canvas.width = dim.w;
            canvas.height = dim.h;
            paperWrapper.style.width = dim.w + 'px';
            paperWrapper.style.height = dim.h + 'px';

            // Restore canvas contents
            ctx.drawImage(tempCanvas, 0, 0);
        }

        // Handle Paper Background Style
        function updatePaperStyle() {
            const style = paperStyleSelect.value;
            paperWrapper.classList.remove('bg-grid', 'bg-lines');
            if (style === 'grid') {
                paperWrapper.classList.add('bg-grid');
            } else if (style === 'lines') {
                paperWrapper.classList.add('bg-lines');
            }
        }

        // Initialize canvas on load
        window.addEventListener('load', () => {
            initPaperSize();
            updatePaperStyle();
            updateUndoRedoState();
        });

        paperSizeSelect.addEventListener('change', initPaperSize);
        paperStyleSelect.addEventListener('change', updatePaperStyle);

        // Mode Switching UI
        function setMode(mode) {
            currentMode = mode;
            [modeDrawBtn, modeTextBtn, modeEraserBtn].forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });

            if (mode === 'draw') {
                modeDrawBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                modeDrawBtn.classList.remove('text-slate-600');
                canvas.style.cursor = 'crosshair';
            } else if (mode === 'text') {
                modeTextBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                modeTextBtn.classList.remove('text-slate-600');
                canvas.style.cursor = 'text';
            } else if (mode === 'eraser') {
                modeEraserBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                modeEraserBtn.classList.remove('text-slate-600');
                canvas.style.cursor = 'cell';
            }
        }

        modeDrawBtn.addEventListener('click', () => setMode('draw'));
        modeTextBtn.addEventListener('click', () => setMode('text'));
        modeEraserBtn.addEventListener('click', () => setMode('eraser'));

        // Pen Selection Logic (10 Distinct Pens)
        const penButtons = document.querySelectorAll('.pen-select-btn');
        const penNames = {
            'ballpoint': '볼펜',
            'fountain': '만년필',
            'highlighter': '형광펜',
            'brush': '붓펜',
            'pencil': '연필',
            'calligraphy': '캘리그라피',
            'neon': '네온펜',
            'spray': '스프레이',
            'dashed': '점선펜',
            'crayon': '크레용'
        };

        penButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                penButtons.forEach(b => {
                    b.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-900');
                    b.classList.add('border-slate-200', 'text-slate-700');
                });
                btn.classList.remove('border-slate-200', 'text-slate-700');
                btn.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-900');
                
                currentPen = btn.dataset.pen;
                currentPenNameDisplay.textContent = penNames[currentPen];
                setMode('draw');
            });
        });

        // Quick Color Selector
        document.querySelectorAll('.quick-color').forEach(btn => {
            btn.addEventListener('click', (e) => {
                penColorInput.value = e.target.dataset.color;
            });
        });

        penSizeInput.addEventListener('input', (e) => {
            sizeValDisplay.textContent = e.target.value + ' px';
        });

        // Drawing Helper Functions
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (currentMode === 'text') {
                const pos = getCanvasCoordinates(e);
                addFloatingTextInput(pos.x, pos.y);
                return;
            }

            // Save canvas state before stroke starts
            saveHistory();

            isDrawing = true;
            const pos = getCanvasCoordinates(e);
            lastX = pos.x;
            lastY = pos.y;
            
            // Draw dot on click
            drawStroke(pos.x, pos.y);
        }

        function drawStroke(x, y) {
            if (!isDrawing) return;

            ctx.save();

            const color = penColorInput.value;
            const size = parseInt(penSizeInput.value, 10);

            if (currentMode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, size * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return;
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Custom rendering for 10 Pens
            switch (currentPen) {
                case 'ballpoint':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'fountain':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 1.5;
                    ctx.globalAlpha = 0.85;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'highlighter':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 3;
                    ctx.globalAlpha = 0.35;
                    ctx.lineCap = 'square';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'brush':
                    ctx.strokeStyle = color;
                    const dist = Math.hypot(x - lastX, y - lastY);
                    ctx.lineWidth = Math.max(1, size * (1 / (dist * 0.1 + 1)));
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'pencil':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath();
                    ctx.moveTo(lastX + (Math.random() - 0.5), lastY + (Math.random() - 0.5));
                    ctx.lineTo(x + (Math.random() - 0.5), y + (Math.random() - 0.5));
                    ctx.stroke();
                    break;

                case 'calligraphy':
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(lastX - size, lastY - size);
                    ctx.lineTo(lastX + size, lastY + size);
                    ctx.lineTo(x + size, y + size);
                    ctx.lineTo(x - size, y - size);
                    ctx.fill();
                    break;

                case 'neon':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = size * 2;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'spray':
                    ctx.fillStyle = color;
                    const density = size * 3;
                    for (let i = 0; i < density; i++) {
                        const offsetX = (Math.random() - 0.5) * size * 3;
                        const offsetY = (Math.random() - 0.5) * size * 3;
                        ctx.fillRect(x + offsetX, y + offsetY, 1, 1);
                    }
                    break;

                case 'dashed':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.setLineDash([size * 2, size * 2]);
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'crayon':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 1.5;
                    ctx.globalAlpha = 0.7;
                    ctx.lineCap = 'round';
                    // Rough stroke simulation
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(lastX + (Math.random() * 2 - 1), lastY + (Math.random() * 2 - 1));
                        ctx.lineTo(x + (Math.random() * 2 - 1), y + (Math.random() * 2 - 1));
                        ctx.stroke();
                    }
                    break;
            }

            ctx.restore();
            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Canvas Mouse / Touch Listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const pos = getCanvasCoordinates(e);
                drawStroke(pos.x, pos.y);
            }
        });
        window.addEventListener('mouseup', stopDrawing);

        // Touch & Pointer Support (Standard stroke without pressure sensitivity)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDrawing(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDrawing) {
                const pos = getCanvasCoordinates(e);
                drawStroke(pos.x, pos.y);
            }
        }, { passive: false });

        window.addEventListener('touchend', stopDrawing);
        window.addEventListener('touchcancel', stopDrawing);

        function drawStroke(x, y) {
            if (!isDrawing) return;

            ctx.save();

            const color = penColorInput.value;
            const size = parseInt(penSizeInput.value, 10);

            if (currentMode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, size * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return;
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Custom rendering for 10 Pens (Fixed Stroke Width)
            switch (currentPen) {
                case 'ballpoint':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'fountain':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 1.5;
                    ctx.globalAlpha = 0.85;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'highlighter':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 3;
                    ctx.globalAlpha = 0.35;
                    ctx.lineCap = 'square';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'brush':
                    ctx.strokeStyle = color;
                    const dist = Math.hypot(x - lastX, y - lastY);
                    ctx.lineWidth = Math.max(1, size * (1 / (dist * 0.1 + 1)));
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'pencil':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath();
                    ctx.moveTo(lastX + (Math.random() - 0.5), lastY + (Math.random() - 0.5));
                    ctx.lineTo(x + (Math.random() - 0.5), y + (Math.random() - 0.5));
                    ctx.stroke();
                    break;

                case 'calligraphy':
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.moveTo(lastX - size, lastY - size);
                    ctx.lineTo(lastX + size, lastY + size);
                    ctx.lineTo(x + size, y + size);
                    ctx.lineTo(x - size, y - size);
                    ctx.fill();
                    break;

                case 'neon':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = size * 2;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'spray':
                    ctx.fillStyle = color;
                    const density = size * 3;
                    for (let i = 0; i < density; i++) {
                        const offsetX = (Math.random() - 0.5) * size * 3;
                        const offsetY = (Math.random() - 0.5) * size * 3;
                        ctx.fillRect(x + offsetX, y + offsetY, 1, 1);
                    }
                    break;

                case 'dashed':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size;
                    ctx.setLineDash([size * 2, size * 2]);
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    break;

                case 'crayon':
                    ctx.strokeStyle = color;
                    ctx.lineWidth = size * 1.5;
                    ctx.globalAlpha = 0.7;
                    ctx.lineCap = 'round';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(lastX + (Math.random() * 2 - 1), lastY + (Math.random() * 2 - 1));
                        ctx.lineTo(x + (Math.random() * 2 - 1), y + (Math.random() * 2 - 1));
                        ctx.stroke();
                    }
                    break;
            }

            ctx.restore();
            lastX = x;
            lastY = y;
        }

        // TEXT BOX CREATION & DRAG SYSTEM
        function addFloatingTextInput(x, y) {
            const container = document.createElement('div');
            container.className = 'floating-text-node pointer-events-auto flex items-start group';
            container.style.left = x + 'px';
            container.style.top = y + 'px';

            const textarea = document.createElement('textarea');
            textarea.className = 'p-1 font-medium text-slate-800 bg-transparent border border-dashed border-indigo-300 rounded focus:border-indigo-600 focus:bg-white/80 transition-all text-base min-w-[120px] min-h-[40px]';
            textarea.placeholder = '텍스트 입력...';
            textarea.style.color = penColorInput.value;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'text-xs text-red-500 bg-white shadow rounded-full w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity -ml-2 -mt-2';
            deleteBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            deleteBtn.onclick = () => container.remove();

            container.appendChild(textarea);
            container.appendChild(deleteBtn);
            overlayLayer.appendChild(container);

            textarea.focus();

            // Enable dragging for the floating text box
            makeDraggable(container, textarea);
        }

        // Generic Draggable Element Functionality
        function makeDraggable(element, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            element.onmousedown = (e) => {
                if (e.target === handle && document.activeElement === handle) return; // Allow text editing
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            };

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // IMAGE ATTACHMENT
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'floating-text-node pointer-events-auto border-2 border-transparent hover:border-indigo-500 rounded p-1 group flex items-start';
                imgContainer.style.left = '50px';
                imgContainer.style.top = '50px';

                const img = document.createElement('img');
                img.src = event.target.result;
                img.className = 'max-w-[250px] h-auto rounded shadow-sm object-contain';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-xs text-red-500 bg-white shadow rounded-full w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity -ml-2 -mt-2';
                deleteBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                deleteBtn.onclick = () => imgContainer.remove();

                imgContainer.appendChild(img);
                imgContainer.appendChild(deleteBtn);
                overlayLayer.appendChild(imgContainer);

                makeDraggable(imgContainer, img);
            };
            reader.readAsDataURL(file);
            imageInput.value = ''; // Reset input
        });

        // Clear Canvas & Overlay
        clearBtn.addEventListener('click', () => {
            if (confirm('노트 전체 내용을 지우시겠습니까?')) {
                saveHistory();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                overlayLayer.innerHTML = '';
            }
        });

        // SAVE AS IMAGE (Merges Drawing Canvas + Overlay Text/Images)
        saveBtn.addEventListener('click', () => {
            // Create a temporary master canvas for export
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;

            // Fill Background based on paper style
            exportCtx.fillStyle = '#FFFFFF';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // Draw Grid or Lines if selected
            const style = paperStyleSelect.value;
            if (style === 'grid') {
                exportCtx.strokeStyle = '#cbd5e1';
                exportCtx.lineWidth = 1;
                for (let x = 0; x < exportCanvas.width; x += 20) {
                    for (let y = 0; y < exportCanvas.height; y += 20) {
                        exportCtx.fillRect(x, y, 1, 1);
                    }
                }
            } else if (style === 'lines') {
                exportCtx.strokeStyle = '#e2e8f0';
                exportCtx.lineWidth = 1;
                for (let y = 28; y < exportCanvas.height; y += 28) {
                    exportCtx.beginPath();
                    exportCtx.moveTo(0, y);
                    exportCtx.lineTo(exportCanvas.width, y);
                    exportCtx.stroke();
                }
            }

            // Draw original canvas artwork
            exportCtx.drawImage(canvas, 0, 0);

            // Render floating overlay items (text, images) into exported image
            const textNodes = overlayLayer.querySelectorAll('.floating-text-node');
            const promises = Array.from(textNodes).map(node => {
                return new Promise((resolve) => {
                    const rect = node.getBoundingClientRect();
                    const wrapperRect = paperWrapper.getBoundingClientRect();
                    const x = rect.left - wrapperRect.left;
                    const y = rect.top - wrapperRect.top;

                    const textarea = node.querySelector('textarea');
                    const img = node.querySelector('img');

                    if (textarea && textarea.value.trim() !== '') {
                        exportCtx.font = '16px "Noto Sans KR", sans-serif';
                        exportCtx.fillStyle = textarea.style.color || '#000000';
                        
                        const lines = textarea.value.split('\n');
                        lines.forEach((line, index) => {
                            exportCtx.fillText(line, x + 8, y + 24 + (index * 20));
                        });
                        resolve();
                    } else if (img) {
                        const tempImg = new Image();
                        tempImg.crossOrigin = 'anonymous';
                        tempImg.onload = () => {
                            exportCtx.drawImage(tempImg, x, y, img.clientWidth, img.clientHeight);
                            resolve();
                        };
                        tempImg.src = img.src;
                    } else {
                        resolve();
                    }
                });
            });

            Promise.all(promises).then(() => {
                // Download image link
                const link = document.createElement('a');
                link.download = `my-note-${Date.now()}.png`;
                link.href = exportCanvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
