<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 스터디 플래너</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --success-color: #22c55e;
            --accent-orange: #f97316;
            --input-bg: #ffffff;
            --badge-bg: #e0e7ff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --badge-bg: #312e81;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px 12px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 반응형 2열 그리드 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 16px;
            }
            .container {
                gap: 20px;
            }
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        /* 카드 공통 스타일 */
        .card-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .card-box {
                padding: 20px;
            }
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        /* 상단 헤더 */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            gap: 10px;
        }

        .date-display {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .quote-box {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-style: italic;
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        @media (min-width: 480px) {
            .quote-box {
                max-width: 100%;
            }
        }

        .theme-toggle-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 폼 요소 모바일 유연한 정렬 */
        .form-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .form-row > * {
            flex: 1 1 auto;
            min-width: 0;
        }

        input, select, textarea {
            padding: 8px 10px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.82rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        /* 프로그레스 바 */
        .progress-container {
            margin-bottom: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
        }

        /* 리스트 영역 높이 제한 & 깔끔한 스크롤 */
        .list-container {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }

        .list-container::-webkit-scrollbar {
            width: 4px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        /* 카드 내부 아이템 */
        .item-card {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            gap: 8px;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-sub);
            opacity: 0.7;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .todo-text {
            word-break: break-word;
            font-size: 0.85rem;
        }

        .subject-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 6px;
            background-color: var(--badge-bg);
            color: var(--primary-color);
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 터치 반응형 탭 스크롤 */
        .subject-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .subject-tabs::-webkit-scrollbar {
            height: 3px;
        }

        .tab-btn {
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        /* 공책 영역 스타일 정의 */
        .notebook-wrapper {
            position: relative;
            background-color: #fdfbf7;
            border-radius: 12px;
            padding: 12px 12px 12px 38px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid #e0dacf;
            overflow: hidden;
            margin-bottom: 10px;
        }

        body.dark-mode .notebook-wrapper {
            background-color: #1a2332;
            border-color: #2e3b4e;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .notebook-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 30px;
            width: 2px;
            background-color: #ff8a8a;
            opacity: 0.7;
            z-index: 1;
        }

        .notebook-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 10px;
            width: 6px;
            background: repeating-linear-gradient(
                to bottom,
                #94a3b8 0px,
                #94a3b8 6px,
                transparent 6px,
                transparent 22px
            );
            border-radius: 4px;
            opacity: 0.5;
        }

        .note-textarea {
            width: 100%;
            height: 160px;
            resize: vertical;
            border: none;
            background: repeating-linear-gradient(
                transparent,
                transparent 25px,
                #d8e2ec 26px
            );
            line-height: 26px;
            font-size: 0.88rem;
            color: #2c3e50;
            font-family: 'Georgia', 'Courier New', serif, 'Malgun Gothic', sans-serif;
            padding: 0 4px;
            outline: none;
            box-sizing: border-box;
            background-attachment: local;
        }

        body.dark-mode .note-textarea {
            color: #e2e8f0;
            background: repeating-linear-gradient(
                transparent,
                transparent 25px,
                #334155 26px
            );
        }

        .export-tools {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .export-btn {
            background-color: var(--badge-bg);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .export-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .info-footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            margin-bottom: 16px;
        }

        .exam-badge {
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 4px;
            background-color: #fef3c7;
            color: #d97706;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        body.dark-mode .exam-badge {
            background-color: #78350f;
            color: #fef3c7;
        }

        /* 모바일 화면 맞춤 미세조정 */
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
            }
            .form-row > * {
                width: 100% !important;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 대시보드 헤더 -->
        <div class="top-header">
            <div>
                <div class="date-display" id="todayDate">----년 --월 --일</div>
                <div class="quote-box" id="quoteBox">"시작하는 것이 시작이다."</div>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 다크 모드</button>
        </div>

        <!-- 메인 대시보드 (반응형 2열 / 모바일 1열 그리드) -->
        <div class="dashboard-grid">
            <!-- 📅 일정 관리 카드 -->
            <div class="card-box">
                <div class="card-title">📅 일정 관리</div>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;">
                    <div class="form-row">
                        <select id="examSubjectInput"></select>
                        <select id="examCategoryInput">
                            <option value="시험">시험</option>
                            <option value="과제">과제</option>
                            <option value="자격증">자격증</option>
                            <option value="개인일정">개인일정</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="text" id="examNameInput" placeholder="일정 제목 (예: 중간고사, 과제)">
                        <input type="date" id="examDateInput">
                    </div>
                    <div class="form-row">
                        <input type="text" id="examMemoInput" placeholder="메모 (선택사항)">
                        <button class="btn btn-primary" onclick="addExamSchedule()">추가</button>
                    </div>
                </div>
                <div class="list-container" id="examScheduleList"></div>
            </div>

            <!-- 🗓️ 요일별 시간표 카드 -->
            <div class="card-box">
                <div class="card-title">🗓️ 요일별 시간표</div>
                
                <div class="subject-tabs" id="dayTabs"></div>

                <div class="form-row" style="margin-bottom: 10px;">
                    <select id="timetableSubjectInput"></select>
                    <input type="time" id="timetableStartTime">
                    <button class="btn btn-primary" onclick="addTimetableEntry()">등록</button>
                </div>

                <div class="list-container" id="timetableList"></div>
            </div>
        </div>

        <!-- 📝 오늘의 할 일 카드 -->
        <div class="card-box">
            <div class="card-title">📝 오늘의 할 일</div>
            
            <div class="progress-container">
                <div class="progress-header">
                    <span>전체 달성도</span>
                    <span id="progressText">0 / 0 (0%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="form-row" style="margin-bottom: 12px;">
                <select id="todoSubjectInput" style="flex: 1;"></select>
                <input type="text" id="todoInput" placeholder="오늘 공부할 내용을 입력하세요..." style="flex: 2;" onkeyup="if(event.key==='Enter') addTodo()">
                <button class="btn btn-primary" onclick="addTodo()">추가</button>
            </div>

            <div class="list-container" id="todoList" style="max-height: 260px;"></div>
        </div>

        <!-- 📖 과목별 요약노트 카드 -->
        <div class="card-box">
            <div class="card-title">📖 과목별 줄노트 (요약)</div>

            <div class="form-row" style="margin-bottom: 8px;">
                <input type="text" id="newSubjectInput" placeholder="새 과목 명칭..." onkeyup="if(event.key==='Enter') addNewSubject()">
                <button class="btn btn-secondary" onclick="addNewSubject()">+ 과목 추가</button>
            </div>

            <div class="subject-tabs" id="subjectTabs"></div>

            <div class="notebook-wrapper">
                <textarea class="note-textarea" id="noteInput" placeholder="공식, 암기할 개념, 핵심 요약을 정리하세요..." oninput="saveCurrentNote()"></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                    <div class="export-tools">
                        <button class="export-btn" onclick="exportNoteToWord()">📄 워드 저장 (.doc)</button>
                        <button class="export-btn" onclick="exportAllNotesToWord()">📂 전체 워드 저장</button>
                        <button class="export-btn" onclick="printOrPdfNote()">🖨️ PDF / 인쇄</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-sub);">
                        <button style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.75rem;" onclick="deleteCurrentSubject()">🗑️ 과목 삭제</button>
                        <span id="noteSaveStatus">자동 저장됨</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="printableNote" style="display: none; padding: 20px; font-family: 'Malgun Gothic', 'Dotum', sans-serif;"></div>

        <div class="info-footer">
            💡 모든 정보는 사용 중인 브라우저(localStorage)에 안전하게 자동 저장됩니다.
        </div>
    </div>

    <script>
        // 기본 데이터 상태 구조
        const defaultSubjects = ['국어', '영어', '수학', '사회', '과학'];
        const daysOfWeek = ['월', '화', '수', '목', '금', '토', '일'];

        let state = {
            subjects: JSON.parse(localStorage.getItem('planner_subjects')) || defaultSubjects,
            currentSubject: '',
            notes: JSON.parse(localStorage.getItem('planner_notes')) || {},
            todos: JSON.parse(localStorage.getItem('planner_todos')) || [],
            exams: JSON.parse(localStorage.getItem('planner_exams')) || [],
            timetable: JSON.parse(localStorage.getItem('planner_timetable')) || {},
            currentDay: '월',
            darkMode: JSON.parse(localStorage.getItem('planner_darkmode')) || false
        };

        const quotes = [
            "시작하는 것이 시작이다.",
            "오늘 보낸 하루는 내일의 너를 만든다.",
            "작은 노력이 모여 큰 결실을 맺는다.",
            "꾸준함이 모든 것을 이긴다.",
            "포기하지 않는 한 실패는 없다."
        ];

        // 초기화
        window.onload = function() {
            if (state.subjects.length > 0) {
                state.currentSubject = state.subjects[0];
            }
            if (state.darkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').innerText = '☀️ 라이트 모드';
            }
            
            initDateAndQuote();
            renderSubjectDropdowns();
            renderSubjectTabs();
            renderDayTabs();
            renderNotes();
            renderTodos();
            renderExams();
            renderTimetable();
        };

        // 날짜 & 명언
        function initDateAndQuote() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const day = dayNames[now.getDay()];

            document.getElementById('todayDate').innerText = `${year}년 ${month}월 ${date}일 (${day})`;
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quoteBox').innerText = `"${randomQuote}"`;
        }

        // 다크 모드 토글
        function toggleTheme() {
            state.darkMode = !state.darkMode;
            localStorage.setItem('planner_darkmode', JSON.stringify(state.darkMode));
            if (state.darkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').innerText = '☀️ 라이트 모드';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeToggleBtn').innerText = '🌙 다크 모드';
            }
        }

        // 과목 선택 드롭다운 갱신
        function renderSubjectDropdowns() {
            const todoSelect = document.getElementById('todoSubjectInput');
            const examSelect = document.getElementById('examSubjectInput');
            const timetableSelect = document.getElementById('timetableSubjectInput');

            const optionsHTML = state.subjects.map(s => `<option value="${s}">${s}</option>`).join('');

            todoSelect.innerHTML = optionsHTML;
            examSelect.innerHTML = optionsHTML;
            timetableSelect.innerHTML = optionsHTML;
        }

        // 과목 탭 갱신
        function renderSubjectTabs() {
            const tabsContainer = document.getElementById('subjectTabs');
            tabsContainer.innerHTML = state.subjects.map(s => `
                <button class="tab-btn ${s === state.currentSubject ? 'active' : ''}" onclick="selectSubject('${s}')">${s}</button>
            `).join('');
        }

        // 요일 탭 갱신
        function renderDayTabs() {
            const dayTabsContainer = document.getElementById('dayTabs');
            dayTabsContainer.innerHTML = daysOfWeek.map(d => `
                <button class="tab-btn ${d === state.currentDay ? 'active' : ''}" onclick="selectDay('${d}')">${d}요일</button>
            `).join('');
        }

        // 과목 선택
        function selectSubject(sub) {
            state.currentSubject = sub;
            renderSubjectTabs();
            renderNotes();
        }

        // 요일 선택
        function selectDay(day) {
            state.currentDay = day;
            renderDayTabs();
            renderTimetable();
        }

        // 새 과목 추가
        function addNewSubject() {
            const input = document.getElementById('newSubjectInput');
            const newSub = input.value.trim();
            if (!newSub) return;

            if (state.subjects.includes(newSub)) {
                alert('이미 존재하는 과목입니다.');
                return;
            }

            state.subjects.push(newSub);
            state.currentSubject = newSub;
            localStorage.setItem('planner_subjects', JSON.stringify(state.subjects));

            input.value = '';
            renderSubjectDropdowns();
            renderSubjectTabs();
            renderNotes();
        }

        // 현재 과목 삭제
        function deleteCurrentSubject() {
            if (state.subjects.length <= 1) {
                alert('최소 하나의 과목은 유지되어야 합니다.');
                return;
            }

            if (!confirm(`'${state.currentSubject}' 과목과 해당 요약노트를 삭제하시겠습니까?`)) return;

            const deletedSub = state.currentSubject;
            state.subjects = state.subjects.filter(s => s !== deletedSub);
            delete state.notes[deletedSub];

            state.currentSubject = state.subjects[0];

            localStorage.setItem('planner_subjects', JSON.stringify(state.subjects));
            localStorage.setItem('planner_notes', JSON.stringify(state.notes));

            renderSubjectDropdowns();
            renderSubjectTabs();
            renderNotes();
        }

        // 요약노트 저장 및 불러오기
        function renderNotes() {
            const textarea = document.getElementById('noteInput');
            textarea.value = state.notes[state.currentSubject] || '';
        }

        function saveCurrentNote() {
            const textarea = document.getElementById('noteInput');
            state.notes[state.currentSubject] = textarea.value;
            localStorage.setItem('planner_notes', JSON.stringify(state.notes));

            const saveStatus = document.getElementById('noteSaveStatus');
            saveStatus.innerText = '저장 중...';
            setTimeout(() => {
                saveStatus.innerText = '자동 저장됨';
            }, 500);
        }

        // 오늘의 할 일 관리
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            const subject = document.getElementById('todoSubjectInput').value;

            if (!text) return;

            state.todos.push({
                id: Date.now(),
                subject: subject,
                text: text,
                completed: false
            });

            localStorage.setItem('planner_todos', JSON.stringify(state.todos));
            input.value = '';
            renderTodos();
        }

        function toggleTodo(id) {
            state.todos = state.todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            localStorage.setItem('planner_todos', JSON.stringify(state.todos));
            renderTodos();
        }

        function deleteTodo(id) {
            state.todos = state.todos.filter(t => t.id !== id);
            localStorage.setItem('planner_todos', JSON.stringify(state.todos));
            renderTodos();
        }

        function renderTodos() {
            const list = document.getElementById('todoList');
            if (state.todos.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-sub); font-size: 0.82rem; padding: 16px;">등록된 할 일이 없습니다.</div>`;
            } else {
                list.innerHTML = state.todos.map(t => `
                    <div class="todo-item ${t.completed ? 'completed' : ''}">
                        <div class="todo-left">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id})">
                            <span class="subject-badge">${t.subject}</span>
                            <span class="todo-text">${escapeHtml(t.text)}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${t.id})">✕</button>
                    </div>
                `).join('');
            }

            // 달성도 계산
            const total = state.todos.length;
            const completedCount = state.todos.filter(t => t.completed).length;
            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

            document.getElementById('progressText').innerText = `${completedCount} / ${total} (${percent}%)`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        // 일정 관리 (시험/과제/개인일정)
        function addExamSchedule() {
            const subject = document.getElementById('examSubjectInput').value;
            const category = document.getElementById('examCategoryInput').value;
            const nameInput = document.getElementById('examNameInput');
            const dateInput = document.getElementById('examDateInput');
            const memoInput = document.getElementById('examMemoInput');

            const name = nameInput.value.trim();
            const date = dateInput.value;
            const memo = memoInput.value.trim();

            if (!name || !date) {
                alert('일정 제목과 날짜를 지정해주세요.');
                return;
            }

            state.exams.push({
                id: Date.now(),
                subject: subject,
                category: category,
                name: name,
                date: date,
                memo: memo
            });

            localStorage.setItem('planner_exams', JSON.stringify(state.exams));
            nameInput.value = '';
            dateInput.value = '';
            memoInput.value = '';
            renderExams();
        }

        function deleteExamSchedule(id) {
            state.exams = state.exams.filter(e => e.id !== id);
            localStorage.setItem('planner_exams', JSON.stringify(state.exams));
            renderExams();
        }

        function renderExams() {
            const list = document.getElementById('examScheduleList');
            if (state.exams.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-sub); font-size: 0.82rem; padding: 16px;">등록된 일정이 없습니다.</div>`;
                return;
            }

            // 날짜 오름차순 정렬
            const sortedExams = [...state.exams].sort((a, b) => new Date(a.date) - new Date(b.date));
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            list.innerHTML = sortedExams.map(e => {
                const examDate = new Date(e.date);
                examDate.setHours(0, 0, 0, 0);

                const diffTime = examDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let dDayText = '';
                if (diffDays === 0) dDayText = 'D-Day';
                else if (diffDays > 0) dDayText = `D-${diffDays}`;
                else dDayText = `D+${Math.abs(diffDays)}`;

                return `
                    <div class="item-card">
                        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;">
                            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                                <span class="subject-badge">${e.subject}</span>
                                <span class="exam-badge">${e.category}</span>
                                <strong style="font-size: 0.85rem; word-break: break-word;">${escapeHtml(e.name)}</strong>
                            </div>
                            <div style="font-size: 0.75rem; color: var(--text-sub);">
                                📅 ${e.date} ${e.memo ? `| 📝 ${escapeHtml(e.memo)}` : ''}
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-size: 0.78rem; font-weight: 800; color: var(--primary-color); white-space: nowrap;">${dDayText}</span>
                            <button class="delete-btn" onclick="deleteExamSchedule(${e.id})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 요일별 시간표 관리
        function addTimetableEntry() {
            const subject = document.getElementById('timetableSubjectInput').value;
            const time = document.getElementById('timetableStartTime').value;

            if (!time) {
                alert('시작 시간을 지정해주세요.');
                return;
            }

            if (!state.timetable[state.currentDay]) {
                state.timetable[state.currentDay] = [];
            }

            state.timetable[state.currentDay].push({
                id: Date.now(),
                subject: subject,
                time: time
            });

            localStorage.setItem('planner_timetable', JSON.stringify(state.timetable));
            renderTimetable();
        }

        function deleteTimetableEntry(id) {
            if (state.timetable[state.currentDay]) {
                state.timetable[state.currentDay] = state.timetable[state.currentDay].filter(t => t.id !== id);
                localStorage.setItem('planner_timetable', JSON.stringify(state.timetable));
                renderTimetable();
            }
        }

        function renderTimetable() {
            const list = document.getElementById('timetableList');
            const dayEntries = state.timetable[state.currentDay] || [];

            if (dayEntries.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-sub); font-size: 0.82rem; padding: 16px;">${state.currentDay}요일 등록된 수업이 없습니다.</div>`;
                return;
            }

            const sortedEntries = [...dayEntries].sort((a, b) => a.time.localeCompare(b.time));

            list.innerHTML = sortedEntries.map(t => `
                <div class="item-card">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary-color); min-width: 48px;">⏰ ${t.time}</span>
                        <span class="subject-badge">${t.subject}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTimetableEntry(${t.id})">✕</button>
                </div>
            `).join('');
        }

        // 워드 (.doc) 저장 기능
        function exportNoteToWord() {
            const content = state.notes[state.currentSubject] || '작성된 요약 내용이 없습니다.';
            const blob = new Blob([`
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>${state.currentSubject} 요약노트</title></head>
                <body>
                    <h2>📚 [${state.currentSubject}] 과목 요약노트</h2>
                    <hr>
                    <pre style="font-family: Arial, sans-serif; font-size: 11pt; white-space: pre-wrap;">${escapeHtml(content)}</pre>
                </body>
                </html>
            `], { type: 'application/msword' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.currentSubject}_요약노트.doc`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportAllNotesToWord() {
            let bodyHTML = `<h2>📚 전체 과목 요약노트</h2><hr>`;
            state.subjects.forEach(sub => {
                const note = state.notes[sub] || '작성된 내용 없음';
                bodyHTML += `
                    <h3>[${sub}]</h3>
                    <pre style="font-family: Arial, sans-serif; font-size: 11pt; white-space: pre-wrap;">${escapeHtml(note)}</pre>
                    <br>
                `;
            });

            const blob = new Blob([`
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>전체 과목 요약노트</title></head>
                <body>${bodyHTML}</body>
                </html>
            `], { type: 'application/msword' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `전체과목_요약노트.doc`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // PDF 및 인쇄 저장
        function printOrPdfNote() {
            const printContainer = document.getElementById('printableNote');
            const content = state.notes[state.currentSubject] || '작성된 요약 내용이 없습니다.';

            printContainer.innerHTML = `
                <h2>📚 [${state.currentSubject}] 과목 요약노트</h2>
                <hr style="margin: 10px 0;">
                <pre style="font-family: Arial, sans-serif; font-size: 12pt; white-space: pre-wrap; line-height: 1.6;">${escapeHtml(content)}</pre>
            `;

            printContainer.style.display = 'block';
            window.print();
            printContainer.style.display = 'none';
        }

        // HTML 문자열 이스케이프
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
